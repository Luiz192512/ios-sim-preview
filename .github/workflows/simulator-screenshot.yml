# Runs the prebuilt simulator app on a free GitHub macOS runner and saves a screenshot.
name: simulator-screenshot
on:
  workflow_dispatch:
jobs:
  shot:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run in iOS Simulator
        run: |
          set -euo pipefail
          APP=SampleIOS.app
          plutil -replace CFBundleSupportedPlatforms -json '["iPhoneSimulator"]' "$APP/Info.plist"
          codesign --force --sign - "$APP"
          BID=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")
          UDID=$(xcrun simctl list devices available | grep -m1 'iPhone' | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "simulator: $UDID, bundle: $BID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BID"
          sleep 8
          xcrun simctl io "$UDID" screenshot screenshot.png
          xcrun simctl spawn "$UDID" launchctl list | grep -i sampleios || true
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot
          path: screenshot.png
